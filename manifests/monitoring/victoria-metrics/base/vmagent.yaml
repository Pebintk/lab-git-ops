apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
spec:
  replicas: 1
  selector:
    matchLabels: { app: vmagent }
  template:
    metadata:
      labels: { app: vmagent }
    spec:
      serviceAccountName: vmagent
      containers:
        - name: vmagent
          image: victoriametrics/vmagent:v1.109.1
          args:
            - -promscrape.config=/config/scrape.yml
            - -remoteWrite.url=http://vmsingle:8428/api/v1/write
            - -httpListenAddr=:8429
          ports:
            - containerPort: 8429
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          configMap:
            name: vmagent-config