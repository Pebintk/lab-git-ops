apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-config
data:
  scrape.yml: |
    global:
      scrape_interval: 30s

    scrape_configs:

      # ── Node-level: the kubelet's own metrics ──────────────────────────
      - job_name: kubelet
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          # Discovery returns the node's own address. Rewrite it to go through
          # the API server proxy instead — nodes are private and not directly
          # reachable from a pod on the metrics port.
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      # ── Container-level: cAdvisor, inside the kubelet ─────────────────
      - job_name: cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # ── Pods that opt in via annotation ────────────────────────────────
      - job_name: kubernetes-pods
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"

          # Discovery emits one target per container port, so a pod with several
          # ports produces several targets that the rewrite below would collapse
          # into duplicates. Keep only the one whose container port equals the
          # annotation. A backreference regex (\d+);\1 cannot express this: the
          # scrape engine uses RE2, which has no backreferences, so vmagent
          # skips the whole job. keepequal compares the two labels directly:
          # keep the target when container_port_number == annotation port.
          - action: keepequal
            source_labels: [__meta_kubernetes_pod_container_port_number]
            target_label: __meta_kubernetes_pod_annotation_prometheus_io_port

          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)

          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
