apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
data:
  # Mounted at /etc/grafana/provisioning/datasources. Read once at startup.
  # NOTE the asymmetry with the dashboard provider: the datasource provisioner
  # does NOT watch for changes. Editing this ConfigMap needs a pod restart to
  # take effect. The dashboard provider (separate file) does hot-reload.
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        # VictoriaMetrics implements the Prometheus query API, so the built-in
        # prometheus type is correct. There is no VictoriaMetrics plugin to add.
        type: prometheus
        access: proxy
        url: http://vmsingle:8428
        isDefault: true
        # Fixed literal uid. Dashboard JSON references the datasource by uid; a
        # random per-boot uid would break every panel after a restart. This is
        # the most common provisioned-dashboard failure — do not remove it.
        uid: victoriametrics
        jsonData:
          httpMethod: POST
          timeInterval: 30s
