# Admin credentials via External Secrets Operator (gcp-store already exists).
# No password in Git. ESO creates Secret `grafana-admin` from Secret Manager.
# Create the value out of band (user runs):
#
#   printf '%s' 'CHOOSE_A_STRONG_PASSWORD' \
#     | gcloud secrets create grafana-admin-password \
#         --data-file=- --project ops-lab-506804
#   # rotate later:
#   printf '%s' 'NEW_PASSWORD' \
#     | gcloud secrets versions add grafana-admin-password \
#         --data-file=- --project ops-lab-506804
#
# Changing the value later needs a grafana pod restart to re-read the env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  target:
    name: grafana-admin
  data:
    - secretKey: admin-password
      remoteRef:
        key: grafana-admin-password
