apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  # Recreate, not RollingUpdate: no PVC, but keeps behaviour predictable on the
  # single spot node and avoids two pods briefly sharing the emptyDir semantics.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      # NOTE: the dashboard provider hot-reloads JSON on its own, but the
      # DATASOURCE provisioner reads only at startup. After changing
      # datasource.yaml, restart grafana (rollout restart) for it to take
      # effect. Dashboard ConfigMap edits need no restart.
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            # Provisioned, stateless. No sign-up, no anonymous access.
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            # Grafana needs a writable home even when fully provisioned. No PVC:
            # the cluster is rebuilt regularly and a PVC is an orphan-prone GCP
            # disk. TRADE-OFF: a dashboard edited in the UI does NOT survive a
            # restart. Workflow is edit -> export JSON -> commit. Do not add a
            # PVC to make UI edits stick.
            - name: storage
              mountPath: /var/lib/grafana
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        # Two dashboard ConfigMaps projected into one directory, one JSON file
        # each. Split because dashboard JSON is large and a ConfigMap caps at 1MB.
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-cluster
              - configMap:
                  name: grafana-dashboard-pods
        - name: storage
          emptyDir: {}
