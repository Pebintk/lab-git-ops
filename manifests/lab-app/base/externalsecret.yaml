apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lab-app
spec:
  # Short so the demo is observable. 1h is the realistic setting — every refresh
  # is a Secret Manager API call, and at 1m that is 1440 calls/day per secret.
  refreshInterval: 1m
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  target:
    # The Kubernetes Secret ESO creates and owns. It is not in Git, and deleting
    # this ExternalSecret deletes it.
    name: lab-app-secret
  data:
    - secretKey: greeting
      remoteRef:
        key: lab-app-greeting
