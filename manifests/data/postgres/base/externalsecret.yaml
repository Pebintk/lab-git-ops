apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres
spec:
  # 1h, not 1m — this is infrastructure, not a demo. Every refresh is a Secret
  # Manager API call.
  #
  # ROTATION CAVEAT: refreshing this Secret does NOT rotate the live database
  # password. Postgres reads POSTGRES_PASSWORD as an env var once at container
  # start, and the exporter reads DATA_SOURCE_PASS the same way. A real rotation
  # needs: new value in Secret Manager -> ESO updates this Secret -> restart
  # postgres-0 AND run `ALTER ROLE kamis PASSWORD '...'` -> restart the exporter.
  # Changing the Secret alone changes nothing. Not solved here.
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  target:
    name: postgres
  data:
    - secretKey: password
      remoteRef:
        key: postgres-kamis-password
