apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-store
spec:
  provider:
    gcpsm:
      projectID: ops-lab-506804
      auth:
        # No service account key anywhere. ESO presents the KSA token, GKE
        # exchanges it for a Google credential via the Workload Identity pool,
        # and Secret Manager authorizes eso-sa. The clusterLocation/clusterName
        # pair is how the provider locates the pool to trade the token against.
        workloadIdentity:
          clusterLocation: us-central1-a
          clusterName: lab
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
