apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Frontend is a standalone SPA — it does not share the Go-service base (no
# database, no JWT secrets, no service-mesh peer URLs). Everything is declared
# here rather than patching base/.

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# CI (Lab-Kamis-App/KAMIS-FE/Jenkinsfile) bumps newTag to the built commit SHA
# with `kustomize edit set image`. The placeholder tag below is only a default.
images:
  - name: us-central1-docker.pkg.dev/ops-lab-506804/lab-images/kamis-frontend
    newTag: latest
