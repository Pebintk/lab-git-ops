# resource: prices catalogue items and holds their stock. It calls nobody — the
# only service with no peer URLs — so this patch is the smallest of the five.
#
# Not the container's `env` block; see ../../README.md.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config
data:
  PORT: "8085"
  postgres-database: kamis_resource
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    metadata:
      annotations:
        # Must equal the containerPort below, or vmagent drops the target.
        prometheus.io/port: "8085"
    spec:
      containers:
        - name: app
          ports:
            # Replaces the list rather than merging into it: container ports
            # merge on containerPort, so without this the base's 8080 would stay
            # and the pod would advertise a port nothing listens on.
            - $patch: replace
            - name: http
              containerPort: 8085
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  ports:
    - $patch: replace
    - name: http
      port: 8085
      targetPort: http
