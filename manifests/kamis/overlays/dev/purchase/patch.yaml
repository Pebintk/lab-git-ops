# purchase: calls profile to resolve supplier names, resource to validate
# catalogue items, asset to register a staged asset once its purchase completes,
# and finance to record the spend.
#
# Like asset, it mounts an emptyDir for uploads, because GCS_BUCKET is unset.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config
data:
  PORT: "8084"
  postgres-database: kamis_purchase
  # profile is the one peer in the other namespace; see ../../README.md.
  PROFILE_URL: http://profile-app.kamis-profile.svc.cluster.local:8080/api
  RESOURCE_URL: http://resource-app.kamis.svc.cluster.local:8085/api
  ASSET_URL: http://asset-app.kamis.svc.cluster.local:8081/api
  FINANCE_URL: http://finance-app.kamis.svc.cluster.local:8082/api
  # Staged-asset photos. Points at the emptyDir below, not the container
  # filesystem: the process runs as uid 65532 and owns no writable path.
  FILE_UPLOAD_DIR: /var/lib/kamis/uploads
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    metadata:
      annotations:
        # Must equal the containerPort below, or vmagent drops the target.
        prometheus.io/port: "8084"
    spec:
      containers:
        - name: app
          ports:
            # Replaces the list rather than merging into it: container ports
            # merge on containerPort, so without this the base's 8080 would stay
            # and the pod would advertise a port nothing listens on.
            - $patch: replace
            - name: http
              containerPort: 8084
          volumeMounts:
            - name: uploads
              mountPath: /var/lib/kamis/uploads
      volumes:
        # Same placeholder as asset: photos do not survive a pod restart, and
        # making them survive is what GCS_BUCKET is for.
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  ports:
    - $patch: replace
    - name: http
      port: 8084
      targetPort: http
