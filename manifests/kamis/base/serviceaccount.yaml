# Identity for the pods, one per service via the overlay's namePrefix. Nothing
# consumes it yet — the services authenticate to Postgres with a password, not
# with a Kubernetes or Google identity.
#
# It exists now for two reasons that are cheaper to satisfy up front than to
# retrofit:
#   - The isolation decision for the private JWT key names a ServiceAccount as
#     the thing an admission policy would allow. That policy, if it is ever
#     added, needs this object to already exist under a stable name.
#   - asset and purchase can store uploads in GCS instead of on local disk when
#     GCS_BUCKET is set. On GKE that means Workload Identity: a Google service
#     account, a roles/iam.workloadIdentityUser binding on it for
#     PROJECT.svc.id.goog[<namespace>/<this-sa>], and the
#     iam.gke.io/gcp-service-account annotation here. Until that exists, leave
#     GCS_BUCKET unset and use FILE_UPLOAD_DIR.
#
# The token is not mounted. Neither the API server nor any Google API is called
# with it today, and an unused credential in a pod is only a liability if it
# leaks. Workload Identity would need this flipped back to true.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
automountServiceAccountToken: false
