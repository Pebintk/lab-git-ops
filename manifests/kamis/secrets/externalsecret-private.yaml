# The signing key. This is the one that has to stay contained, and the whole
# reason kamis-profile exists as a separate namespace from kamis.
#
# A Secret is namespace-scoped, not pod-scoped. If this manifest sat in the same
# namespace as the five verifying services, every one of their pods could mount
# this Secret with a volume — a pod's filesystem is not constrained by RBAC, and
# `resourceNames` on the Secret only gates who can *read* it through the API.
# Nothing in a single namespace prevents a mount. The boundary has to be the
# namespace.
#
# NOT CLAIMED as isolation anywhere: an admission policy restricting references
# to this Secret name to profile's ServiceAccount would be a second, independent
# control, and it is the thing to add if this ever has to hold up as more than
# a lab. Not built here.
#
# Consumed by profile alone, as JWT_SECRET_KEY. The other five pods carry a
# secretKeyRef to this name marked `optional`, so its absence in their namespace
# is expected and harmless — see base/deployment.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kamis-jwt-private
  namespace: kamis-profile
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  target:
    name: kamis-jwt-private
  data:
    # base64 PKCS8 DER, as auth.NewIssuer expects — NOT PEM.
    - secretKey: private-key
      remoteRef:
        key: kamis-jwt-private
