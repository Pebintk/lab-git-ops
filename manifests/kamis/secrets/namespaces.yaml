# The two namespaces the KAMIS services live in.
#
# `kamis` holds the five verifying services. `kamis-profile` holds profile, and
# exists for one reason: a Secret is namespace-scoped, not pod-scoped, so two
# same-namespace ExternalSecrets give no isolation at all — any pod in `kamis`
# could mount `kamis-jwt-private` with a volume, and RBAC `resourceNames` on the
# Secret does not prevent that, because it gates API reads and not kubelet
# mounts. Separate namespaces are the isolation.
#
# Declared here rather than relying on ArgoCD's CreateNamespace so the wave
# ordering is explicit: namespaces first, ExternalSecrets after.
apiVersion: v1
kind: Namespace
metadata:
  name: kamis
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
---
apiVersion: v1
kind: Namespace
metadata:
  name: kamis-profile
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
