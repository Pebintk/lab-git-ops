# The verification key, for the five services that only verify tokens:
# asset, finance, project, purchase, resource.
#
# Referenced by every one of their pods as JWT_PUBLIC_KEYS. A public key is not
# sensitive — this Secret exists to be mounted, not to be protected — which is
# why it is the one of the pair that is allowed to sit in a shared namespace.
#
# The same manifest is repeated into kamis-profile (see the -profile sibling
# file) for a dull reason: secretKeyRef is namespace-local, so profile cannot
# read this one across the boundary. Two Services cannot share a name for the
# same class of reason; two Secrets can, but they must be created twice.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kamis-jwt-public
  namespace: kamis
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  # 1h, matching the Postgres ExternalSecret. Not 1m: every refresh is a Secret
  # Manager API call.
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  target:
    name: kamis-jwt-public
  data:
    # base64 X509 / SubjectPublicKeyInfo DER, as config.go's publicKeys() and
    # auth.parsePublicKey expect — NOT PEM with -----BEGIN----- headers.
    - secretKey: public-key
      remoteRef:
        key: kamis-jwt-public
