# The verification key for profile. Same Secret Manager entry as the copy in the
# `kamis` namespace; only the namespace differs.
#
# profile needs its own copy because secretKeyRef is namespace-local and profile
# runs in kamis-profile. It verifies tokens with the public key exactly as the
# other five do — issuing is an additional capability, not a replacement.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kamis-jwt-public
  namespace: kamis-profile
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  target:
    name: kamis-jwt-public
  data:
    - secretKey: public-key
      remoteRef:
        key: kamis-jwt-public
