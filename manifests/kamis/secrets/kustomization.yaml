apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deliberately no `namespace:` transformer and no `namePrefix`. Each ExternalSecret
# carries its own metadata.namespace, because this one kustomization spans two
# namespaces by design — that split is the isolation. A transformer here would
# flatten it back into one, which is the bug the split exists to prevent.
#
# Kept out of manifests/kamis/overlays/ for a second reason: those overlays set
# namePrefix, which renames every resource they pull in. An ExternalSecret named
# asset-kamis-jwt-public would no longer be the Secret the deployment asks for.
resources:
  - namespaces.yaml
  - externalsecret-public-kamis.yaml
  - externalsecret-public-profile.yaml
  - externalsecret-private.yaml
  - externalsecret-postgres-kamis.yaml
  - externalsecret-postgres-profile.yaml
