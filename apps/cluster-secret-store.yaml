apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-secret-store
  namespace: argocd
  annotations:
    # After external-secrets (-10), before lab-app (0). The ClusterSecretStore is
    # a CRD instance, so it needs the CRDs installed; and lab-app's ExternalSecret
    # references this store by name, so the store must exist first.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: https://github.com/Pebintk/lab-git-ops.git
    targetRevision: main
    path: manifests/platform/secret-store
  destination:
    server: https://136.64.202.103
    namespace: external-secrets
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
