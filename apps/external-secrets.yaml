apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # Earliest wave. This Application installs the ExternalSecret and
    # ClusterSecretStore CRDs; anything referencing those kinds must sync only
    # after it reports Healthy. Without the ordering the first sync fails with
    # `no matches for kind "ExternalSecret"` — the CRD does not exist yet, so the
    # API server rejects the resource outright.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0
    helm:
      values: |
        installCRDs: true
        serviceAccount:
          create: true
          name: external-secrets
          annotations:
            # The Kubernetes half of Workload Identity. The Google half is
            # google_service_account_iam_member.eso_wi in lab-infra/platform.
            # With only one of the two in place, Secret Manager returns 403 and
            # the ExternalSecret sits in SecretSyncedError.
            iam.gke.io/gcp-service-account: eso-sa@ops-lab-506804.iam.gserviceaccount.com
        # Single replica: the lab node pool floors at one spot node.
        replicaCount: 1
        webhook:
          replicaCount: 1
        certController:
          replicaCount: 1
  destination:
    server: https://136.64.202.103
    namespace: external-secrets
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      # CRDs in this chart exceed the annotation size limit for client-side
      # apply, which fails with "metadata.annotations: Too long".
      - ServerSideApply=true
