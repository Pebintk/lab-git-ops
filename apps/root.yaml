apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pebintk/lab-git-ops.git
    targetRevision: main
    path: apps
    directory:
      recurse: false
      exclude: root.yaml        # ← don't manage yourself
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd           # ← Applications live in argocd, not dev
  syncPolicy:
    automated:
      selfHeal: true
      prune: true