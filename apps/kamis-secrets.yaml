apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kamis-secrets
  namespace: argocd
  annotations:
    # After cluster-secret-store (-5), because every ExternalSecret here names the
    # gcp-store ClusterSecretStore and cannot be created before it exists. Also
    # after external-secrets (-10), which owns the CRDs. Strictly between those
    # and the services at 0, so the Secrets exist before the pods that read them —
    # the wave is what turns "the Secret will probably be there" into an ordering
    # ArgoCD enforces.
    #
    # A separate Application from the services because it is a separate lifecycle:
    # it owns the two namespaces and the secret references, and it is the only
    # thing that changes when a key is rotated. See manifests/kamis/README.md.
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  source:
    repoURL: https://github.com/Pebintk/lab-git-ops.git
    targetRevision: main
    path: manifests/kamis/secrets
  destination:
    # The Application's destination namespace is only a default for resources
    # that do not set one. Every object in this path carries its own: the
    # ExternalSecrets are split across `kamis` and `kamis-profile` on purpose,
    # and that split is the isolation, not an accident of layout.
    server: https://34.46.105.136
    namespace: kamis
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    # CreateNamespace is not set: the namespaces are declared in the manifests, at
    # wave -15, so they exist before anything namespaced is applied.
