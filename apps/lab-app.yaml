apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-app
  namespace: argocd
  annotations:
    # Last. Its ExternalSecret needs the CRDs from external-secrets (-10) and the
    # store from cluster-secret-store (-5); its Ingress needs the nginx
    # IngressClass. Wave 0 is the default, stated here to make the ordering
    # visible next to the two Applications it depends on.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/Pebintk/lab-git-ops.git
    targetRevision: main
    path: manifests/lab-app/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
