apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kamis-asset
  namespace: argocd
  annotations:
    # Last, with lab-app. Needs the Namespaces and the JWT Secrets from
    # kamis-secrets (-4) and the database from postgres (-5).
    #
    # ONE hand-written Application, deliberately. Seven Applications differing by
    # a path string is the textbook list-generator case, but the brief's order is
    # to get one service green by hand first and convert to an ApplicationSet
    # after — so that the generated Applications can be diffed against a known
    # good one, and so the duplication is felt before it is abstracted. The
    # conversion is the next step, not this one.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/Pebintk/lab-git-ops.git
    targetRevision: main
    path: manifests/kamis/overlays/dev/asset
  destination:
    server: https://34.46.105.136
    namespace: kamis
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    # The namespace is created by kamis-secrets. CreateNamespace is set anyway so
    # this Application is not the thing that fails if it is ever applied on its
    # own.
    syncOptions:
      - CreateNamespace=true
